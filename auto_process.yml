name: Auto Update Final Report

on:
  push:
    paths:
      - 'data/**'
      - 'STR Loss.xlsx'
      - 'templates/**'
      - 'config.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        run: python scripts/process_data.py

      - name: Commit output
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action Bot"
          git add output/Final_Report.xlsx
          git diff --staged --quiet || (git commit -m "🤖 Auto-updated Final_Report.xlsx" && git push)
